---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio-client
  namespace: conntrack-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fortio-client
  template:
    metadata:
      labels:
        app: fortio-client
    spec:
      containers:
        - name: fortio
          image: fortio/fortio:latest
          command: ["fortio", "server", "-http-port", "8080"]
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 1Gi
---
# fortio 서버 (UI 접근용)
apiVersion: v1
kind: Service
metadata:
  name: fortio-ui
  namespace: conntrack-test
spec:
  type: ClusterIP
  selector:
    app: fortio-client
  ports:
    - port: 8080
      targetPort: 8080
