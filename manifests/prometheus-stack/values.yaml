# kube-prometheus-stack Helm values
# conntrack 분석에 필요한 최소 구성

prometheus:
  prometheusSpec:
    retention: 24h
    scrapeInterval: 15s
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

    # kube-proxy 메트릭 scrape 설정
    additionalScrapeConfigs:
      - job_name: 'kube-proxy'
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__address__]
            regex: (.+):(.+)
            target_label: __address__
            replacement: ${1}:10249
        metrics_path: /metrics
        scheme: http

grafana:
  enabled: true
  adminPassword: "conntrack-lab"
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'conntrack'
          orgId: 1
          folder: 'Conntrack Analysis'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/conntrack

kubeProxy:
  enabled: true

alertmanager:
  enabled: false

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
